name: VideoHub focused Go checks

on:
  pull_request:
    branches: [videohub]
    paths:
      - storage/data/**
      - storage/options.go
      - config/**
      - model/ctr/**
      - storage/vectors/**
      - logics/**
      - server/**
      - master/**
      - worker/**
      - common/floats/**
      - go.mod
      - go.sum
      - .github/workflows/videohub-vectors.yml
  push:
    branches: [videohub]
    paths:
      - storage/data/**
      - storage/options.go
      - config/**
      - model/ctr/**
      - storage/vectors/**
      - logics/**
      - server/**
      - master/**
      - worker/**
      - common/floats/**
      - go.mod
      - go.sum
      - .github/workflows/videohub-vectors.yml
  # Manual trigger for the synthetic paired write experiment below.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serving:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test HNSW, feedback cancellation and dataset retention including race detection
        run: >-
          go test -race ./storage/vectors ./logics ./server ./master ./worker
          -run '^(TestHNSW.*|TestDatasetRetentionLoader|TestNewRecommender(FeedbackCancellation|FullFeedback)|TestGetRecommendFeedback(Cancellation|Success))$'
          -count=1 -timeout=10m
      # The legacy parallel loader has baseline races; see dataset-retention.md.
      # Keep its functional coverage separate from the focused race gate above.
      - name: Test SQLite dataset loader invariants
        run: >-
          go test ./master
          -run '^TestMaster$/(TestLoadDataFromDatabase.*|TestNonPersonalizedRecommend|TestEmitSnapshot)$'
          -count=1 -timeout=10m
      - name: Test optimization cadence and refresh independence with controlled time
        run: |
          go test -race ./master -run '^TestOptimization' -count=1 -timeout=5m
          go test -race ./master -run '^TestMaster$/TestOptimization' -count=1 -timeout=5m
      - name: Build deployed components
        env:
          CGO_ENABLED: '0'
        run: go build ./cmd/gorse-master ./cmd/gorse-server ./cmd/gorse-worker

  twitch_view_counts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.32
        env:
          MYSQL_ROOT_PASSWORD: isolated-test-password
          MYSQL_DATABASE: gorse_counts_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=isolated-test-password mysql --protocol=TCP --host=127.0.0.1 --user=root --batch --skip-column-names --execute='SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare the isolated MySQL visibility fixture
        env:
          MYSQL_PWD: isolated-test-password
        run: >-
          docker exec -e MYSQL_PWD "${{ job.services.mysql.id }}"
          mysql --user=root --execute='CREATE DATABASE gorse_visibility_ci CHARACTER SET utf8mb4'
      - name: Test MySQL upgrade, visibility, mixed rollback, reader parity and concurrent labels
        env:
          MYSQL_URI: mysql://root:isolated-test-password@tcp(127.0.0.1:3306)/
          TWITCH_COUNT_MYSQL_URI: mysql://root:isolated-test-password@tcp(127.0.0.1:3306)/gorse_counts_test
          GORSE_VISIBILITY_MYSQL_URI: mysql://root:isolated-test-password@tcp(127.0.0.1:3306)/gorse_visibility_ci
        run: |
          set -o pipefail
          go test -race ./storage/data ./server ./config ./model/ctr -count=1 -timeout=10m -v | tee mysql-tests.log
          grep -q -- '--- PASS: TestFilterVisibleItemsEquivalence/mysql ' mysql-tests.log
          grep -q -- '--- PASS: TestMySQLTwitchViewCountsRollbackMixedRepresentations ' mysql-tests.log
      # Real mysqldump/restore of all data tables into a uniquely named synthetic
      # database on the isolated service container. The explicit -run and -v
      # make a skip or missing client tool visible instead of silent.
      - name: Test isolated mysqldump backup, restore, readers and rollback copy-back
        env:
          TWITCH_COUNT_BACKUP_MYSQL_URI: mysql://root:isolated-test-password@tcp(127.0.0.1:3306)/gorse_counts_test
          TWITCH_COUNT_BACKUP_TOOL_CONTAINER: vh-count-tests-backup-ci
        run: |
          set -o pipefail
          docker rename "${{ job.services.mysql.id }}" vh-count-tests-backup-ci
          docker exec vh-count-tests-backup-ci mysqldump --version
          go test -race ./storage/data -run '^TestMySQLTwitchViewCountsBackupRestore$' -count=1 -timeout=5m -v | tee backup-test.log
          grep -q -- '--- PASS: TestMySQLTwitchViewCountsBackupRestore' backup-test.log

  # Synthetic write experiment for this PR: not a production load test. It needs a
  # named disposable container so cgroup block counters can be read.
  twitch_view_count_write_experiment:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start an isolated, named MySQL 8.0.32 container
        env:
          MYSQL_PWD: isolated-test-password
        run: |
          docker run -d --name vh-count-tests-ci -p 127.0.0.1:3306:3306 \
            -e MYSQL_ROOT_PASSWORD=isolated-test-password -e MYSQL_DATABASE=gorse_counts_test mysql:8.0.32
          ready=0
          for i in $(seq 1 40); do
            if docker exec -e MYSQL_PWD vh-count-tests-ci mysql --protocol=TCP --host=127.0.0.1 --user=root --batch --skip-column-names --execute='SELECT 1' >/dev/null 2>&1; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1 || { echo 'Isolated MySQL did not become authenticated TCP-ready'; exit 1; }
      - name: Run the paired logical/redo/kernel-block write experiment
        env:
          TWITCH_COUNT_MYSQL_URI: mysql://root:isolated-test-password@tcp(127.0.0.1:3306)/gorse_counts_test
          TWITCH_COUNT_BENCH_CONTAINER: vh-count-tests-ci
          TWITCH_COUNT_BENCH_OUTPUT: ${{ runner.temp }}/twitch-count-write-volume.json
        run: go test ./storage/data -run '^TestMySQLTwitchViewCountWriteVolume$' -count=1 -timeout=25m -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twitch-count-write-volume
          path: ${{ runner.temp }}/twitch-count-write-volume.json
          if-no-files-found: error
      - name: Remove the disposable container
        if: always()
        run: docker rm -f vh-count-tests-ci
