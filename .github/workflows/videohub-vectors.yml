name: VideoHub focused Go checks

on:
  pull_request:
    branches: [videohub]
    paths:
      - storage/vectors/**
      - logics/**
      - server/**
      - master/**
      - worker/**
      - common/floats/**
      - go.mod
      - go.sum
      - .github/workflows/videohub-vectors.yml
  push:
    branches: [videohub]
    paths:
      - storage/vectors/**
      - logics/**
      - server/**
      - master/**
      - worker/**
      - common/floats/**
      - go.mod
      - go.sum
      - .github/workflows/videohub-vectors.yml

permissions:
  contents: read

jobs:
  serving:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test HNSW, feedback cancellation and dataset retention including race detection
        run: >-
          go test -race ./storage/vectors ./logics ./server ./master ./worker
          -run '^(TestHNSW.*|TestDatasetRetentionLoader|TestNewRecommender(FeedbackCancellation|FullFeedback)|TestGetRecommendFeedback(Cancellation|Success))$'
          -count=1 -timeout=10m
      - name: Diagnose SQLite loader races at unchanged base revision
        run: |
          git fetch --no-tags --depth=1 origin 39614f450dcfd716b578c6ac9d71c8ac9379fbdd
          mkdir "$RUNNER_TEMP/gorse-loader-baseline"
          git archive 39614f450dcfd716b578c6ac9d71c8ac9379fbdd | tar -x -C "$RUNNER_TEMP/gorse-loader-baseline"
          cd "$RUNNER_TEMP/gorse-loader-baseline"
          go test -race ./master -run '^TestMaster$/(TestLoadDataFromDatabase.*|TestNonPersonalizedRecommend|TestEmitSnapshot)$' -count=1 -timeout=10m
      - name: Build deployed components
        env:
          CGO_ENABLED: '0'
        run: go build ./cmd/gorse-master ./cmd/gorse-server ./cmd/gorse-worker
