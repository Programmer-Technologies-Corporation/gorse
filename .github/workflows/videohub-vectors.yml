name: VideoHub focused Go checks

on:
  pull_request:
    branches: [videohub]
    paths:
      - storage/data/**
      - storage/options.go
      - config/**
      - model/ctr/**
      - storage/vectors/**
      - logics/**
      - server/**
      - master/**
      - worker/**
      - common/floats/**
      - go.mod
      - go.sum
      - .github/workflows/videohub-vectors.yml
  push:
    branches: [videohub]
    paths:
      - storage/data/**
      - storage/options.go
      - config/**
      - model/ctr/**
      - storage/vectors/**
      - logics/**
      - server/**
      - master/**
      - worker/**
      - common/floats/**
      - go.mod
      - go.sum
      - .github/workflows/videohub-vectors.yml

permissions:
  contents: read

jobs:
  serving:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test HNSW, feedback cancellation and dataset retention including race detection
        run: >-
          go test -race ./storage/vectors ./logics ./server ./master ./worker
          -run '^(TestHNSW.*|TestDatasetRetentionLoader|TestNewRecommender(FeedbackCancellation|FullFeedback)|TestGetRecommendFeedback(Cancellation|Success))$'
          -count=1 -timeout=10m
      # The legacy parallel loader has baseline races; see dataset-retention.md.
      # Keep its functional coverage separate from the focused race gate above.
      - name: Test SQLite dataset loader invariants
        run: >-
          go test ./master
          -run '^TestMaster$/(TestLoadDataFromDatabase.*|TestNonPersonalizedRecommend|TestEmitSnapshot)$'
          -count=1 -timeout=10m
      - name: Build deployed components
        env:
          CGO_ENABLED: '0'
        run: go build ./cmd/gorse-master ./cmd/gorse-server ./cmd/gorse-worker

  twitch_view_counts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.32
        env:
          MYSQL_ROOT_PASSWORD: isolated-test-password
          MYSQL_DATABASE: gorse_counts_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pisolated-test-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test MySQL upgrade, reader parity, atomic projection and concurrent labels
        env:
          MYSQL_URI: mysql://root:isolated-test-password@tcp(127.0.0.1:3306)/
          TWITCH_COUNT_MYSQL_URI: mysql://root:isolated-test-password@tcp(127.0.0.1:3306)/gorse_counts_test
        run: go test -race ./storage/data ./server ./config ./model/ctr -count=1 -timeout=10m
